# Example forge.yaml. Lives at the root of the backend project (the one with the Dockerfile).
# Never put passwords, tokens or private keys in this file.
version: 1

project:
  name: auth-backend

build:
  docker: auto                 # auto, native or wsl (Docker inside WSL, Windows only); auto tries native first
  # wsl_distro: Ubuntu         # optional: WSL distribution that has Docker (default: your default one)
  # allow_dirty: true          # build even with uncommitted changes (release ID ends in -dirty); same as --allow-dirty
  images:
    - name: backend
      service: s0              # deltactl service key (s0 = auth-backend, s1 = gueo-back-end); only needed with deployment
      context: .
      dockerfile: Dockerfile
      image: auth-backend      # must match S0_IMAGE of the deltactl instance
      # target: production      # optional: name of the Dockerfile stage to build (default: the last stage)
  tests:
    - ["npm", "test"]          # argv, never a shell line

upload:
  target: mpa                  # ssh alias from ~/.ssh/config (or user@host); `forge ship` copies the release here with scp
  remote_dir: images           # folder on the server, relative to your home there; it must already exist

# Optional: only used by `forge deploy`, `rollback` and `status` (deltactl on the server).
# If you only upload images, delete this whole section.
deployment:
  host: 10.20.0.2              # private WireGuard IP of the production host
  user: forge-deploy
  ssh_port: 22
  known_hosts: ~/.ssh/known_hosts
  ssh_key: ~/.ssh/forge_deploy   # dedicated key; optional (default: ssh's own identity selection)
  remote_dir: /srv/forge
  deltactl_path: /srv/itc-deploy/deltactl
  instance: colorado           # deltactl instance to update

retention:
  releases: 5                  # local artifacts and staging only; never loaded images
